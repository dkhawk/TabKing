<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="crown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" stroke="#334155" stroke-width="8" />
  
  <!-- Stacked Tab Cards (Representing Tab Groups) -->
  <rect x="96" y="110" width="320" height="290" rx="24" fill="#1e293b" opacity="0.6" stroke="#475569" stroke-width="4"/>
  <rect x="116" y="140" width="280" height="260" rx="20" fill="#0f172a" opacity="0.8" stroke="#64748b" stroke-width="4"/>
  
  <!-- Main Active Tab Window -->
  <rect x="136" y="170" width="240" height="230" rx="16" fill="#1e293b" stroke="url(#accent)" stroke-width="6" filter="url(#glow)"/>
  
  <!-- Crown Icon (TabKing Logo Symbol) -->
  <path d="M176 340 L176 250 L216 290 L256 220 L296 290 L336 250 L336 340 Z" fill="url(#crown)" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" />
  
  <!-- Small Group Dots -->
  <circle cx="206" cy="315" r="8" fill="#38bdf8" />
  <circle cx="256" cy="315" r="8" fill="#a855f7" />
  <circle cx="306" cy="315" r="8" fill="#f43f5e" />
</svg>
