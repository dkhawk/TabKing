<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TabKing - Smart Tab Manager</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <img src="../icons/icon-48.png" alt="TabKing" class="brand-logo">
        <div class="brand-text">
          <h1 class="brand-title">TabKing</h1>
          <span class="brand-badge">PRO</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="openFinderBtn" class="icon-btn" title="Open Visual Tab Finder & Advanced Search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        </button>
        <button id="openOptionsBtn" class="icon-btn" title="Open Dashboard Options">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </header>

    <!-- Stats Bar -->
    <div class="stats-bar">
      <div class="stat-chip">
        <span class="stat-value" id="totalTabsCount">0</span>
        <span class="stat-label">Tabs</span>
      </div>
      <div class="stat-chip" id="staleChipBtn" style="cursor: pointer;" title="Filter stale tabs inactive >2 hours">
        <span class="stat-value" id="staleTabsCount" style="color: #fb923c;">0</span>
        <span class="stat-label">Stale</span>
      </div>
      <div class="stat-chip">
        <span class="stat-value" id="activeGroupsCount">0</span>
        <span class="stat-label">Groups</span>
      </div>
      <div class="stat-chip">
        <span class="stat-value" id="savedSessionsCount">0</span>
        <span class="stat-label">Sessions</span>
      </div>
    </div>

    <!-- Full Tab View Launch Banner -->
    <div style="margin-bottom: 10px;">
      <button id="openFullTabViewBtn" class="btn primary-btn" style="width: 100%; justify-content: center; font-size: 13px; padding: 10px 14px; background: linear-gradient(135deg, #0284c7 0%, #6366f1 100%);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/><polyline points="15 3 21 3 21 9"/><line x1="21" y1="3" x2="14" y2="10"/></svg>
        <span>Launch Full Visual Tab View</span>
      </button>
    </div>

    <!-- Quick Actions Toolbar -->
    <div class="action-grid">
      <button id="autoGroupBtn" class="btn primary-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        <span>Auto Group</span>
      </button>
      <button id="closeStalePopupBtn" class="btn tertiary-btn" title="Close all unpinned tabs inactive >2h">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        <span>Close Stale</span>
      </button>
      <button id="groupByDomainBtn" class="btn secondary-btn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        <span>By Domain</span>
      </button>
      <button id="saveSessionBtn" class="btn secondary-btn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        <span>Save Session</span>
      </button>
    </div>

    <!-- Navigation Tabs -->
    <div class="nav-tabs">
      <button id="tabOpenView" class="nav-tab active">
        <span>Open Workspace</span>
      </button>
      <button id="tabSavedView" class="nav-tab">
        <span>Saved Sessions</span>
      </button>
    </div>

    <!-- View: Open Workspace -->
    <section id="viewOpenWorkspace" class="view-panel active">
      <!-- Search Input -->
      <div class="search-box">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input type="text" id="searchInput" placeholder="Search tabs by title, URL or group..." autocomplete="off">
        <button id="clearSearchBtn" class="clear-btn hidden">&times;</button>
      </div>

      <!-- Quick Group Actions & Selection Toolbar -->
      <div class="workspace-toolbar">
        <div class="selection-controls">
          <label class="select-all-label" title="Select all filtered tabs">
            <input type="checkbox" id="selectAllCheckbox">
            <span class="select-all-text">Select All</span>
          </label>
          <span id="selectedCountBadge" class="selected-count-badge hidden">0 selected</span>
        </div>
        <div class="group-controls">
          <button id="ungroupAllBtn" class="small-btn">Ungroup All</button>
          <button id="collapseGroupsBtn" class="small-btn">Collapse Groups</button>
          <button id="expandGroupsBtn" class="small-btn">Expand Groups</button>
        </div>
      </div>

      <!-- Bulk Action Bar for Selection -->
      <div id="selectionActionBar" class="selection-action-bar hidden">
        <button id="closeSelectedBtn" class="btn danger-btn small-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          <span>Close Selected (<span id="closeSelectedCount">0</span>)</span>
        </button>
        <button id="deselectAllBtn" class="small-btn">Deselect All</button>
      </div>

      <!-- Tab Tree / List -->
      <div id="tabsContainer" class="tabs-scroll-area">
        <!-- Rendered dynamically -->
      </div>
    </section>

    <!-- View: Saved Sessions -->
    <section id="viewSavedSessions" class="view-panel">
      <div id="sessionsContainer" class="sessions-scroll-area">
        <!-- Rendered dynamically -->
      </div>
    </section>
  </div>

  <!-- Save Session Modal Dialog -->
  <dialog id="saveModal" class="modal-dialog">
    <div class="modal-content">
      <h3 class="modal-title">Save Tab Session</h3>
      <p class="modal-desc">Save open tab groups to restore them later without wasting RAM.</p>
      
      <label class="form-label" for="sessionNameInput">Session Name</label>
      <input type="text" id="sessionNameInput" class="form-input" placeholder="e.g. Project Research Phase 1">

      <div class="form-checkbox-group">
        <input type="checkbox" id="closeTabsCheck" checked>
        <label for="closeTabsCheck">Close tabs after saving to free up memory</label>
      </div>

      <div class="modal-actions">
        <button id="cancelSaveBtn" class="btn tertiary-btn">Cancel</button>
        <button id="confirmSaveBtn" class="btn primary-btn">Save Session</button>
      </div>
    </div>
  </dialog>

  <script src="../summary.js"></script>
  <script src="popup.js"></script>
</body>
</html>
